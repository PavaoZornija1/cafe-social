name: Deploy API (Hetzner)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/oracle/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Nest API to Hetzner
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # No script_stop: appleboy/ssh-action v1.2.2 dropped that input and
          # warns on every run. Failure propagation comes from `set -euo
          # pipefail` in the script below, which is what was doing the work.
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/cafe-social
            git fetch --depth 1 origin main
            git reset --hard origin/main
            cd deploy/oracle
            test -f .env
            docker compose up -d --build
            # Nest needs a few seconds after the container starts. Curling
            # immediately races the boot and returns 502, failing the run even
            # though the deploy succeeded (see run 33340306134). Poll instead.
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null https://api.cafe-social.com/api/health; then
                echo "API healthy after $((i * 5))s"
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "API did not become healthy within 150s"
              docker compose logs --tail 50 api || true
              exit 1
            fi
