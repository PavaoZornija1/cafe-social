name: Database backup

on:
  schedule:
    # shortcut: public-repo schedules stop after 60 inactive days; use a dedicated scheduler before leaving this repo unattended.
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare database connection and encryption key
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          node <<'JS'
          const fs = require('fs');
          if (!process.env.BACKUP_DATABASE_URL || !process.env.BACKUP_PASSPHRASE) {
            throw new Error('Backup secrets are missing');
          }
          const url = new URL(process.env.BACKUP_DATABASE_URL);
          const env = {
            PGHOST: url.hostname, PGPORT: url.port || '5432',
            PGUSER: decodeURIComponent(url.username), PGPASSWORD: decodeURIComponent(url.password),
            PGDATABASE: url.pathname.slice(1), PGSSLMODE: 'verify-full',
            PGSSLROOTCERT: '/certs/supabase-ca.crt', PGCONNECT_TIMEOUT: '15',
          };
          if (Object.values(env).some(value => /[\r\n]/.test(value))) throw new Error('Invalid database connection');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/database-backup.env`, Object.entries(env).map(([k,v]) => `${k}=${v}`).join('\n'), { mode: 0o600 });
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/backup-passphrase`, process.env.BACKUP_PASSPHRASE, { mode: 0o600 });
          JS

      - name: Dump and encrypt application database
        run: |
          set -euo pipefail
          docker run --rm --env-file "$RUNNER_TEMP/database-backup.env" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/backend/certs/supabase-ca.crt,dst=/certs/supabase-ca.crt,readonly" \
            postgres:17-alpine pg_dump --format=custom --schema=public --no-owner --no-privileges \
            | gpg --batch --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                --passphrase-file "$RUNNER_TEMP/backup-passphrase" \
                --output "$RUNNER_TEMP/cafe-social.dump.gpg"
          test -s "$RUNNER_TEMP/cafe-social.dump.gpg"

      - name: Store encrypted off-site backup
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/cafe-social.dump.gpg
          retention-days: 30
          if-no-files-found: error

      - name: Restore backup into an isolated temporary database
        run: |
          set -euo pipefail
          docker run --detach --name backup-restore --network none \
            --tmpfs /var/lib/postgresql/data -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for i in $(seq 1 30); do
            if docker exec backup-restore pg_isready -U postgres; then break; fi
            sleep 1
          done
          gpg --batch --decrypt --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/backup-passphrase" "$RUNNER_TEMP/cafe-social.dump.gpg" \
            | docker exec -i backup-restore pg_restore --clean --if-exists --exit-on-error --no-owner --no-privileges -U postgres -d postgres
          test "$(docker exec backup-restore psql -U postgres -Atqc 'SELECT count(*) FROM public._prisma_migrations')" -gt 0
          docker exec backup-restore psql -U postgres -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public."Player"; SELECT count(*) FROM public."Venue";'
          test "$(docker exec backup-restore psql -U postgres -Atqc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public' AND NOT rowsecurity")" -eq 0

      - name: Clean up temporary credentials and restore database
        if: always()
        run: |
          docker rm -f backup-restore 2>/dev/null || true
          rm -f "$RUNNER_TEMP/database-backup.env" "$RUNNER_TEMP/backup-passphrase"
